<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Currículos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #556B2F;
            color: #f2f2f2;
        }
        .main-container {
            display: flex;
            gap: 20px;
        }
        .left-column {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .right-column {
            flex-grow: 1;
        }
        .stat-card, .dashboard-section {
            background: #4A5D23;
            padding: 20px;
            border-radius: 8px;
        }
        h1, h2, h3 {
            text-align: center;
        }
        .stat-card h3 {
            margin-top: 0;
        }
        .stat-card p {
            font-size: 2em;
            text-align: center;
            margin: 0;
        }
        form {
            display: flex;
            gap: 10px;
        }
        input[type="email"] {
            flex-grow: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button, select {
            padding: 10px 20px;
            border: none;
            background-color: #3A4F41;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        #submission-history li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #4A5D23;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            border-radius: 8px;
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        /* Custom styles for flatpickr calendar */
        .flatpickr-calendar {
            background-color: #f2f2f2 !important;
            color: #333 !important;
        }
    </style>
</head>
<body>
    <h1>Controle de Envios</h1>
    <div class="main-container">
        <div class="left-column">
            <div class="stat-card">
                <h3>Enviados no Mês</h3>
                <p id="monthly-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Aguardando</h3>
                <p id="awaiting-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Positivos</h3>
                <p id="positive-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Negativos</h3>
                <p id="negative-count">0</p>
            </div>
        </div>
        <div class="right-column">
            <div class="dashboard-section">
                <form id="email-form">
                    <input type="email" id="email" placeholder="Digite o e-mail" required>
                    <button type="submit">Enviar</button>
                </form>
            </div>
            <div id="calendar-container" class="dashboard-section"></div>
            <div class="dashboard-section" id="chart-container">
                <h2>Evolução de Envios</h2>
                <canvas id="submissions-chart"></canvas>
            </div>
            <div class="dashboard-section">
                <h3>Histórico de envios:</h3>
                <ul id="submission-history"></ul>
            </div>
        </div>
    </div>

    <!-- The Modal -->
    <div id="submissions-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2 id="modal-title">Envios do Dia</h2>
        <ul id="modal-submission-list"></ul>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
