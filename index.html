<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Currículos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #556B2F;
            color: #f2f2f2;
        }
        .main-container {
            display: flex;
            gap: 20px;
        }
        .left-column {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .right-column {
            flex-grow: 1;
        }
        .stat-card, .dashboard-section {
            background: #4A5D23;
            padding: 20px;
            border-radius: 8px;
        }
        h1, h2, h3 {
            text-align: center;
        }
        .stat-card h3 {
            margin-top: 0;
        }
        .stat-card p {
            font-size: 2em;
            text-align: center;
            margin: 0;
        }
        form {
            display: flex;
            gap: 10px;
        }
        input[type="email"] {
            flex-grow: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button, select {
            padding: 10px 20px;
            border: none;
            background-color: #3A4F41;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        #submission-history li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <h1>Controle de Envios</h1>
    <div class="main-container">
        <div class="left-column">
            <div class="stat-card">
                <h3>Enviados no Mês</h3>
                <p id="monthly-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Aguardando</h3>
                <p id="awaiting-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Positivos</h3>
                <p id="positive-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Negativos</h3>
                <p id="negative-count">0</p>
            </div>
        </div>
        <div class="right-column">
            <div class="dashboard-section">
                <form id="email-form">
                    <input type="email" id="email" placeholder="Digite o e-mail" required>
                    <button type="submit">Enviar</button>
                </form>
            </div>
            <div class="dashboard-section" id="chart-container">
                <h2>Evolução de Envios</h2>
                <canvas id="submissions-chart"></canvas>
            </div>
            <div class="dashboard-section">
                <h3>Histórico de envios:</h3>
                <ul id="submission-history"></ul>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
