<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Currículos</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #556B2F; /* Verde militar */
            color: #f2f2f2;
        }
        #container {
            max-width: 600px;
            margin: 0 auto;
            background: #4A5D23; /* Sombra mais clara de verde */
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="email"] {
            flex-grow: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button, select {
            padding: 10px 20px;
            border: none;
            background-color: #3A4F41; /* Verde mais escuro */
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #556B2F;
        }
        li:last-child {
            border-bottom: none;
        }
        select {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Controle de Envios</h1>
        <form id="email-form">
            <input type="email" id="email" placeholder="Digite o e-mail para o qual enviou o currículo" required>
            <button type="submit">Adicionar</button>
        </form>
        <h3>Histórico de envios:</h3>
        <ul id="submission-history">
            <!-- Envios serão adicionados aqui -->
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
