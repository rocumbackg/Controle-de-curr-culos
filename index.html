<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Currículos</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #556B2F;
            color: #f2f2f2;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #4A5D23;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
        }
        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="email"] {
            flex-grow: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            border: none;
            background-color: #3A4F41;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        #dashboard {
            background: #3A4F41;
            padding: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Controle de Envios</h1>
        <form id="email-form">
            <input type="email" id="email" placeholder="Digite o e-mail" required>
            <button type="submit">Enviar</button>
        </form>
        <div id="dashboard">
            <h2>Último dia de envio:</h2>
            <p id="last-submission-day">Nenhum envio registrado.</p>
            <h3>Histórico de envios:</h3>
            <ul id="submission-history">
                <!-- Histórico será preenchido pelo JavaScript -->
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
